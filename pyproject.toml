[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitrix24-portal-scraper"
version = "1.0.0"
description = "Raspagem resiliente de portal legado sem API com Playwright, levando os dados para o Bitrix24"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "playwright>=1.45",
    # zoneinfo (fuso de Brasilia) precisa da base IANA, que o Windows nao tem.
    'tzdata>=2024.1; sys_platform == "win32"',
]

[project.scripts]
raspar-portal = "scraper.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
